# Site settings
title: Chen Xi
description: Software Engineer & Technology Enthusiast
author: Chen Xi
url: "https://hixichen.github.io"
baseurl: ""

# Theme settings
remote_theme: daattali/beautiful-jekyll

# Navigation
navbar-links:
  Posts: "https://hixichen.github.io"
  About Me: "about"

# Social network links
social-network-links:
  github: hixichen

# Post settings
excerpt_length: 50
feed_show_excerpt: true
feed_show_tags: true

# Pagination
paginate: 5
paginate_path: "/page:num/"

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap

# Build settings
markdown: kramdown
highlighter: rouge
timezone: UTC

# Beautiful Jekyll settings
navbar-col: "#EAEAEA"
navbar-text-col: "#404040"
navbar-border-col: "#DDDDDD"
page-col: "#FFFFFF"
text-col: "#404040"
link-col: "#008AFF"
hover-col: "#0085A1"
footer-col: "#EAEAEA"
footer-text-col: "#777777"
footer-link-col: "#404040"

# Other settings
round-avatar: true
show-avatar: true

# Exclude files
exclude:
  - CHANGELOG.md
  - CNAME
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - Vagrantfile
  - hexo_to_hugo_converter.py
  - requirements.txt
  - CONVERSION_README.md
  - hugo_posts